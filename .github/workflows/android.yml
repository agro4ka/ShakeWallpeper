name: Super Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Clean Android Project
      run: |
        npm install -g cordova
        cordova create fresh_project com.example.shake "ShakeWallpaper"
        cd fresh_project
        cordova platform add android
        
        # Умный поиск и копирование всех файлов из репозитория в шаблон
        mkdir -p platforms/android/app/src/main/java/com/example/shake/
        find .. -maxdepth 3 -name "*.java" ! -path "*/fresh_project/*" -exec cp {} platforms/android/app/src/main/java/com/example/shake/ \; || true
        find .. -maxdepth 3 -name "*.png" ! -path "*/fresh_project/*" -exec cp {} platforms/android/app/src/main/res/drawable/ \; || true
        find .. -maxdepth 3 -name "*.xml" ! -path "*/fresh_project/*" ! -name "AndroidManifest.xml" -exec cp {} platforms/android/app/src/main/res/values/ \; || true
        
        # Сборка
        cd platforms/android
        chmod +x gradlew
        ./gradlew assembleDebug
        
        mkdir -p ../../../output
        cp app/build/outputs/apk/debug/*.apk ../../../output/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shake-wallpaper-apk
        path: "output/*.apk"
