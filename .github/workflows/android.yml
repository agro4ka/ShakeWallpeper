name: Super Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Clean Android Project
      run: |
        # Устанавливаем инструмент для генерации чистого шаблона
        npm install -g cordova
        cordova create fresh_project com.example.shake "ShakeWallpaper"
        cd fresh_project
        cordova platform add android
        
        # Переносим ваши файлы (код и ресурсы) в чистый проект
        mkdir -p platforms/android/app/src/main/java/com/example/shake/
        cp -r ../*.java platforms/android/app/src/main/java/com/example/shake/ || true
        cp -r ../*.png platforms/android/app/src/main/res/drawable/ || true
        cp -r ../*.xml platforms/android/app/src/main/res/values/ || true
        
        # Запускаем чистую сборку
        cd platforms/android
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # Выносим готовый APK наружу
        mkdir -p ../../../output
        cp app/build/outputs/apk/debug/*.apk ../../../output/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shake-wallpaper-apk
        path: "output/*.apk"
